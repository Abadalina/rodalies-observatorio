name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Una vez al dia: detecta si Renfe cambia el formato del feed aunque nadie haya
  # tocado el codigo. Es el fallo mas probable de este proyecto y el que mas
  # tarda en notarse si no se vigila.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  calidad:
    name: Estilo y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev,api]"
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .
      - name: mypy --strict
        run: mypy

  tests:
    name: Tests unitarios e integracion
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rodalies
          POSTGRES_PASSWORD: solo-para-tests
          POSTGRES_DB: rodalies_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rodalies -d rodalies_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RODALIES_TEST_DATABASE_URL: postgresql://rodalies:solo-para-tests@localhost:5432/rodalies_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev,api]"
      - name: pytest (incluye los tests de integracion)
        run: pytest -v

  extremo-a-extremo:
    name: Prueba completa con la fuente sintetica
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rodalies
          POSTGRES_PASSWORD: solo-para-tests
          POSTGRES_DB: rodalies_demo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rodalies -d rodalies_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RODALIES_DATABASE_URL: postgresql://rodalies:solo-para-tests@localhost:5432/rodalies_demo
      RODALIES_READONLY_PASSWORD: solo-para-tests
      RODALIES_SOURCE: synthetic
      RODALIES_NUCLEOS: "51"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev,api]"
      - name: Migrar, cargar horario, capturar y refrescar
        run: |
          rodalies migrate
          rodalies load-gtfs
          rodalies poll
          rodalies refresh --blocking
      - name: Comprobaciones de calidad
        run: rodalies check
      - name: El historico tiene datos
        run: rodalies stats
      - name: Exportar el conjunto de datos
        run: rodalies export --source synthetic --salida /tmp/demo.csv
      - uses: actions/upload-artifact@v4
        with:
          name: dataset-demo
          path: /tmp/demo.csv

  imagen:
    name: Imagen y compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: La demo arranca sin credenciales
        run: docker compose -f docker-compose.demo.yml config --quiet
      - name: Produccion exige las tres contrasenas
        env:
          POSTGRES_PASSWORD: validacion
          READONLY_PASSWORD: validacion
          GRAFANA_PASSWORD: validacion
        run: docker compose config --quiet
      - name: Construir la imagen
        run: docker build -f docker/Dockerfile -t rodalies-observatorio:ci .
      - name: La imagen arranca
        run: docker run --rm rodalies-observatorio:ci rodalies --help

  fuente:
    name: La fuente de Renfe sigue publicando lo esperado
    runs-on: ubuntu-latest
    # Sin `continue-on-error`: si Renfe cambia el formato, este trabajo tiene que
    # ponerse en rojo y abrir una incidencia. Un aviso que no falla no es un aviso.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Descargar y validar el feed en vivo
        id: comprobacion
        run: python scripts/check_source.py
      - name: Abrir incidencia si la fuente ha cambiado
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const titulo = 'La fuente GTFS-RT de Renfe ha cambiado o no responde';
            const abiertas = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'fuente',
            });
            if (abiertas.data.some(i => i.title === titulo)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: titulo, labels: ['fuente'],
              body: `La comprobacion diaria ha fallado en ${context.runId}.\n\n`
                  + `Revisa docs/FUENTE_DATOS.md y el registro del trabajo.`,
            });
