apiVersion: 1

providers:
  - name: rodalies
    orgId: 1
    folder: Rodalies
    type: file
    disableDeletion: false
    # Los paneles se editan en el repositorio, no en la interfaz: asi el panel
    # que ve un reclutador es exactamente el que esta versionado.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
